<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent: #0d99ff;
    --accent2: #7c4dff;
    --text: #e0e0e0;
    --muted: rgba(255,255,255,0.38);
    --border: rgba(255,255,255,0.08);
    --selected-bg: rgba(13,153,255,0.14);
    --selected-border: rgba(13,153,255,0.6);
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 12px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 10px 12px 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }
  header h1 { font-size: 13px; font-weight: 600; }
  .tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab {
    flex: 1; padding: 7px; text-align: center;
    cursor: pointer; font-size: 11px; color: var(--muted);
    border-bottom: 2px solid transparent; transition: all 0.15s;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .panel { display: none; flex: 1; flex-direction: column; overflow: hidden; }
  .panel.active { display: flex; }
  .scroll { flex: 1; overflow-y: auto; padding: 8px 10px; }
  .scroll::-webkit-scrollbar { width: 3px; }
  .scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

  /* Section label */
  .slabel {
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.08em;
    margin: 10px 0 5px;
  }
  .slabel:first-child { margin-top: 0; }

  /* Parent selector hint */
  .hint {
    font-size: 11px; color: var(--accent);
    background: var(--selected-bg);
    border: 1px solid var(--selected-border);
    border-radius: 6px;
    padding: 5px 8px;
    margin-bottom: 6px;
    display: none;
  }
  .hint.visible { display: block; }

  /* Frame items */
  .frame-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 8px;
    border-radius: var(--radius);
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .frame-item .fname {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 11px;
  }
  .add-root-btn, .add-child-btn {
    font-size: 10px; padding: 2px 6px; border-radius: 4px;
    border: none; cursor: pointer; white-space: nowrap; font-weight: 500;
    transition: filter 0.1s;
  }
  .add-root-btn {
    background: rgba(13,153,255,0.18); color: var(--accent);
  }
  .add-root-btn:hover { filter: brightness(1.3); }
  .add-child-btn {
    background: rgba(124,77,255,0.18); color: #b39dff;
    display: none;
  }
  .add-child-btn.visible { display: block; }
  .add-child-btn:hover { filter: brightness(1.3); }

  /* Tree */
  .tree-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px;
    min-height: 50px;
  }
  .tree-empty { color: var(--muted); font-size: 11px; text-align: center; padding: 16px 0; }
  .tree-node {
    display: flex; align-items: center; gap: 5px;
    padding: 4px 6px; border-radius: 6px;
    border: 1px solid transparent;
    cursor: pointer; transition: all 0.1s;
    margin: 1px 0;
  }
  .tree-node:hover { background: rgba(255,255,255,0.04); }
  .tree-node.selected {
    background: var(--selected-bg);
    border-color: var(--selected-border);
  }
  .tree-node .tog {
    width: 15px; height: 15px; border-radius: 3px;
    background: var(--accent); color: #fff; font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .tree-node .tog:hover { filter: brightness(1.2); }
  .tree-node .sp { width: 15px; flex-shrink: 0; }
  .tree-node .nname {
    flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px;
  }
  .tree-node .acts { display: flex; gap: 3px; }
  .ibtn {
    width: 18px; height: 18px; border-radius: 4px;
    border: none; background: rgba(255,255,255,0.07);
    color: var(--text); cursor: pointer; font-size: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ibtn:hover { background: rgba(255,255,255,0.15); }
  .children { padding-left: 18px; }

  /* Bottom bar */
  .bottom-bar {
    padding: 8px 10px; border-top: 1px solid var(--border);
    display: flex; gap: 6px; flex-shrink: 0;
  }
  .btn {
    flex: 1; padding: 8px; border-radius: 8px; border: none;
    font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-secondary {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.07); }

  /* View list */
  .view-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 7px 10px; margin-bottom: 5px;
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; transition: border-color 0.15s;
  }
  .view-card:hover { border-color: var(--accent); }
  .view-card .vname { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
  .chip { font-size: 10px; padding: 2px 5px; border-radius: 4px; background: rgba(13,153,255,0.15); color: var(--accent); }
  .url-link { font-size: 10px; color: var(--accent); text-decoration: none; }
  .empty { color: var(--muted); font-size: 11px; text-align: center; padding: 20px 0; }

  /* ── Hover preview float ── */
  #preview-float {
    position: fixed;
    z-index: 9999;
    display: none;
    pointer-events: none;
    width: 210px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 16px 48px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.3);
  }
  #preview-float-img {
    width: 100%; display: block;
    min-height: 60px;
    background: #0d0d1a;
    object-fit: contain;
  }
  #preview-float-skeleton {
    width: 100%; height: 120px;
    background: linear-gradient(90deg, #16213e 25%, #1e2d4a 50%, #16213e 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    display: none;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  #preview-float-footer {
    padding: 7px 10px;
    background: #16213e;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  #preview-float-name {
    font-size: 11px; font-weight: 500;
    color: #e2e8f0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #preview-float-hint {
    font-size: 9px; color: rgba(255,255,255,0.35); margin-top: 2px;
  }

  /* ── Canvas selection preview panel ── */
  #canvas-preview {
    flex-shrink: 0;
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    border-bottom: 0px solid var(--border);
  }
  #canvas-preview.open {
    max-height: 400px;
    border-bottom-width: 1px;
  }

  /* — linked state: full thumbnail — */
  #cp-linked { display: none; flex-direction: column; }
  #cp-img-wrap {
    background: #0a0a18; overflow: hidden; cursor: pointer;
  }
  #cp-img {
    width: 100%; display: block; max-height: 200px; object-fit: contain;
  }
  #cp-skel {
    width: 100%; height: 140px;
    background: linear-gradient(90deg, #16213e 25%, #1e2d4a 50%, #16213e 75%);
    background-size: 200% 100%;
    animation: shimmer 1.2s infinite;
    display: none;
  }
  #cp-footer {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; background: var(--surface);
  }
  .cp-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 5px #22c55e; flex-shrink: 0;
  }
  #cp-linked-name {
    flex: 1; font-size: 11px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cp-btn {
    font-size: 10px; padding: 3px 8px; border-radius: 5px;
    cursor: pointer; font-weight: 500; white-space: nowrap;
    border: 1px solid transparent; transition: filter 0.1s; flex-shrink: 0;
  }
  .cp-btn:hover { filter: brightness(1.2); }
  .cp-btn-blue  { background: rgba(13,153,255,0.15); color: var(--accent); border-color: rgba(13,153,255,0.3); }
  .cp-btn-red   { background: rgba(248,113,113,0.12); color: #f87171; border-color: rgba(248,113,113,0.25); }

  /* — unlinked state: link prompt + inline picker — */
  #cp-unlinked { display: none; flex-direction: column; }
  #cp-unlinked-header {
    display: flex; align-items: center; gap: 7px;
    padding: 8px 10px; background: var(--surface);
  }
  .cp-no-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: rgba(255,255,255,0.25); flex-shrink: 0;
  }
  #cp-unlinked-name {
    flex: 1; font-size: 11px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #cp-no-link-badge {
    font-size: 9px; padding: 1px 5px; border-radius: 4px;
    background: rgba(255,255,255,0.07); color: var(--muted);
    flex-shrink: 0;
  }
  #cp-picker {
    display: none; flex-direction: column;
    border-top: 1px solid var(--border); max-height: 220px;
  }
  #cp-picker.open { display: flex; }
  #cp-search-wrap { padding: 6px 8px; flex-shrink: 0; }
  #cp-search {
    width: 100%; padding: 5px 8px;
    background: #0f172a; border: 1px solid var(--border);
    border-radius: 5px; color: var(--text); font-size: 11px; outline: none;
    transition: border-color 0.15s;
  }
  #cp-search:focus { border-color: rgba(13,153,255,0.5); }
  #cp-search::placeholder { color: var(--muted); }
  #cp-frame-list {
    flex: 1; overflow-y: auto; padding: 0 8px 6px;
  }
  #cp-frame-list::-webkit-scrollbar { width: 3px; }
  #cp-frame-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  .cp-frame-item {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 7px; border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border);
    margin-bottom: 3px; cursor: pointer; transition: border-color 0.1s;
  }
  .cp-frame-item:hover { border-color: rgba(255,255,255,0.2); }
  .cp-frame-name {
    flex: 1; font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cp-link-btn {
    font-size: 10px; padding: 2px 7px;
    background: rgba(13,153,255,0.15); color: var(--accent);
    border: 1px solid rgba(13,153,255,0.3);
    border-radius: 4px; cursor: pointer; font-weight: 600;
    flex-shrink: 0; white-space: nowrap; transition: filter 0.1s;
  }
  .cp-link-btn:hover { filter: brightness(1.2); }
</style>
</head>
<body>

<!-- Hover preview float -->
<div id="preview-float">
  <div id="preview-float-skeleton"></div>
  <img id="preview-float-img" src="" alt="">
  <div id="preview-float-footer">
    <div id="preview-float-name"></div>
    <div id="preview-float-hint">クリックでデザインへ移動</div>
  </div>
</div>

<header>
  <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
    <circle cx="8" cy="3" r="2.5" stroke="#0d99ff" stroke-width="1.5"/>
    <circle cx="2.5" cy="12" r="2.5" stroke="#0d99ff" stroke-width="1.5"/>
    <circle cx="13.5" cy="12" r="2.5" stroke="#0d99ff" stroke-width="1.5"/>
    <line x1="8" y1="5.5" x2="2.5" y2="9.5" stroke="#0d99ff" stroke-width="1.2"/>
    <line x1="8" y1="5.5" x2="13.5" y2="9.5" stroke="#0d99ff" stroke-width="1.2"/>
  </svg>
  <h1>Site Flow Mapper</h1>
</header>

<div class="tabs">
  <div class="tab active" data-tab="build">🔧 ツリー構築</div>
  <div class="tab" data-tab="view">🗺️ 遷移図</div>
</div>

<!-- Canvas selection preview (slides in when any node is selected) -->
<div id="canvas-preview">

  <!-- State A: linked → show thumbnail -->
  <div id="cp-linked">
    <div id="cp-img-wrap" onclick="cpJump()">
      <div id="cp-skel"></div>
      <img id="cp-img" src="" alt="">
    </div>
    <div id="cp-footer">
      <div class="cp-dot"></div>
      <span id="cp-linked-name"></span>
      <button class="cp-btn cp-btn-blue" onclick="cpJump()">デザインへ ↗</button>
      <button class="cp-btn cp-btn-red" onclick="cpUnlink()">解除</button>
    </div>
  </div>

  <!-- State B: selected but no link → offer linking -->
  <div id="cp-unlinked">
    <div id="cp-unlinked-header">
      <div class="cp-no-dot"></div>
      <span id="cp-unlinked-name"></span>
      <span id="cp-no-link-badge">リンクなし</span>
      <button class="cp-btn cp-btn-blue" onclick="cpTogglePicker()">+ リンク</button>
    </div>
    <div id="cp-picker">
      <div id="cp-search-wrap">
        <input id="cp-search" placeholder="フレームを検索...">
      </div>
      <div id="cp-frame-list"></div>
    </div>
  </div>

</div>

<!-- BUILD PANEL -->
<div class="panel active" id="panel-build">
  <div class="scroll">

    <!-- Parent hint -->
    <div class="hint" id="parent-hint">📌 親: <span id="parent-name"></span> &nbsp;<button class="ibtn" id="clear-parent" style="display:inline-flex;">✕</button></div>

    <!-- Frame list -->
    <div class="slabel">フレーム一覧</div>
    <div id="frame-list"><div class="empty">スキャン中...</div></div>

    <!-- Tree -->
    <div class="slabel" style="margin-top:12px;">遷移ツリー</div>
    <div class="tree-wrap" id="tree-root">
      <div class="tree-empty">↑ 「Root追加」でルートを追加してください</div>
    </div>

  </div>
  <div class="bottom-bar">
    <button class="btn btn-secondary" id="btn-scan">再スキャン</button>
    <button class="btn btn-primary" id="btn-generate">遷移図を生成</button>
  </div>
</div>

<!-- VIEW PANEL -->
<div class="panel" id="panel-view">
  <div class="scroll" id="view-list"><div class="empty">ツリーを構築して遷移図を生成してください</div></div>
  <div class="bottom-bar">
    <button class="btn btn-secondary" id="btn-regen">再描画</button>
  </div>
</div>

<script>
let frames = [];
let tree = {};
let roots = [];
let collapsed = {};
let selectedParentId = null;
let cpLinkedId = null;   // currently linked design frame id

function post(msg) { parent.postMessage({ pluginMessage: msg }, '*'); }

// ── Canvas selection preview ──────────────────────────────────────────────
function bytesToBase64(bytes) {
  let binary = '';
  const chunk = 8192;
  for (let i = 0; i < bytes.length; i += chunk)
    binary += String.fromCharCode(...bytes.slice(i, i + chunk));
  return btoa(binary);
}

function cpShowLinked(linkedId, linkedName, bytes) {
  cpLinkedId = linkedId;
  document.getElementById('canvas-preview').classList.add('open');
  document.getElementById('cp-linked').style.display = 'flex';
  document.getElementById('cp-unlinked').style.display = 'none';
  document.getElementById('cp-linked-name').textContent = linkedName;
  const skel = document.getElementById('cp-skel');
  const img  = document.getElementById('cp-img');
  if (bytes && bytes.length) {
    skel.style.display = 'none';
    img.style.display  = 'block';
    img.src = 'data:image/png;base64,' + bytesToBase64(bytes);
  } else {
    img.style.display  = 'none';
    skel.style.display = 'block';
  }
}

function cpShowUnlinked(selNodeName) {
  cpLinkedId = null;
  document.getElementById('canvas-preview').classList.add('open');
  document.getElementById('cp-linked').style.display = 'none';
  document.getElementById('cp-unlinked').style.display = 'flex';
  document.getElementById('cp-unlinked-name').textContent = selNodeName;
  document.getElementById('cp-picker').classList.remove('open');
  document.getElementById('cp-search').value = '';
}

function cpClose() {
  cpLinkedId = null;
  document.getElementById('canvas-preview').classList.remove('open');
  document.getElementById('cp-linked').style.display = 'none';
  document.getElementById('cp-unlinked').style.display = 'none';
  document.getElementById('cp-img').src = '';
}

function cpJump() {
  if (cpLinkedId) post({ type: 'jump-to-design', nodeId: cpLinkedId });
}

function cpUnlink() {
  post({ type: 'unlink-canvas-node' });
}

function cpTogglePicker() {
  const picker = document.getElementById('cp-picker');
  picker.classList.toggle('open');
  if (picker.classList.contains('open')) {
    renderCpFrameList();
    document.getElementById('cp-search').focus();
  }
}

function renderCpFrameList() {
  const q  = document.getElementById('cp-search').value.toLowerCase();
  const el = document.getElementById('cp-frame-list');
  const filtered = frames.filter(f => f.name.toLowerCase().includes(q));
  el.innerHTML = '';
  if (!filtered.length) {
    el.innerHTML = '<div style="color:rgba(255,255,255,0.35);font-size:11px;text-align:center;padding:12px 0">フレームが見つかりません</div>';
    return;
  }
  filtered.forEach(f => {
    const div = document.createElement('div');
    div.className = 'cp-frame-item';
    const name = document.createElement('span');
    name.className = 'cp-frame-name';
    name.textContent = f.name; name.title = f.name;
    div.appendChild(name);
    const btn = document.createElement('button');
    btn.className = 'cp-link-btn';
    btn.textContent = 'リンク';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      post({ type: 'link-canvas-node', targetId: f.id });
    });
    div.appendChild(btn);
    div.addEventListener('click', () => post({ type: 'link-canvas-node', targetId: f.id }));
    el.appendChild(div);
  });
}

document.getElementById('cp-search').addEventListener('input', renderCpFrameList);

// ---- Tab switching ----
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'view') renderViewList();
  });
});

// ---- Hover preview ----
const thumbCache = {};
let currentHoverId = null;

const floatEl    = document.getElementById('preview-float');
const floatImg   = document.getElementById('preview-float-img');
const floatSkel  = document.getElementById('preview-float-skeleton');
const floatName  = document.getElementById('preview-float-name');

function positionFloat(x, y) {
  const W = 210, margin = 10;
  const vpW = window.innerWidth, vpH = window.innerHeight;
  let left = x + 14;
  if (left + W > vpW - margin) left = x - W - 14;
  let top = y - 10;
  if (top + floatEl.offsetHeight > vpH - margin)
    top = vpH - floatEl.offsetHeight - margin;
  floatEl.style.left = left + 'px';
  floatEl.style.top  = Math.max(margin, top) + 'px';
}

function showFloat(nodeId, name, x, y) {
  currentHoverId = nodeId;
  floatName.textContent = name;
  floatEl.style.display = 'block';
  positionFloat(x, y);

  if (thumbCache[nodeId]) {
    floatSkel.style.display = 'none';
    floatImg.style.display  = 'block';
    floatImg.src = thumbCache[nodeId];
  } else {
    floatImg.style.display  = 'none';
    floatSkel.style.display = 'block';
    post({ type: 'get-thumbnail', nodeId });
  }
}

function hideFloat() {
  currentHoverId = null;
  floatEl.style.display = 'none';
}

// ---- Messages ----
window.onmessage = (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'scan-result') {
    frames = msg.frames || [];
    tree = msg.tree || {};
    collapsed = msg.collapsed || {};
    rebuildRoots();
    renderFrameList();
    renderTree();
  }
  if (msg.type === 'collapsed-updated') {
    collapsed = msg.collapsed;
    renderTree();
  }
  if (msg.type === 'thumbnail-result') {
    if (msg.bytes && msg.bytes.length) {
      const src = 'data:image/png;base64,' + bytesToBase64(msg.bytes);
      thumbCache[msg.nodeId] = src;
      if (currentHoverId === msg.nodeId) {
        floatSkel.style.display = 'none';
        floatImg.style.display  = 'block';
        floatImg.src = src;
      }
    }
  }
  if (msg.type === 'canvas-selection') {
    if (!msg.selNodeId) {
      cpClose();
    } else if (msg.linkedId) {
      cpShowLinked(msg.linkedId, msg.linkedName || msg.linkedId, msg.bytes);
    } else {
      cpShowUnlinked(msg.selNodeName || msg.selNodeId);
    }
  }
};

function rebuildRoots() {
  const allChildren = new Set(Object.values(tree).flat());
  roots = Object.keys(tree).filter(id => !allChildren.has(id));
}

// ---- Parent selector ----
function setParent(id) {
  selectedParentId = id;
  const f = frames.find(fr => fr.id === id);
  document.getElementById('parent-name').textContent = f ? f.name : id;
  document.getElementById('parent-hint').classList.add('visible');
  document.querySelectorAll('.add-child-btn').forEach(b => b.classList.add('visible'));
  renderTree();
}

function clearParent() {
  selectedParentId = null;
  document.getElementById('parent-hint').classList.remove('visible');
  document.querySelectorAll('.add-child-btn').forEach(b => b.classList.remove('visible'));
  renderTree();
}

document.getElementById('clear-parent').addEventListener('click', clearParent);

// ---- Frame list ----
function renderFrameList() {
  const el = document.getElementById('frame-list');
  if (!frames.length) {
    el.innerHTML = '<div class="empty">フレームが見つかりません<br><small style="color:rgba(255,255,255,0.3)">Figmaページにフレームが存在するか確認してください</small></div>';
    return;
  }
  el.innerHTML = '';
  frames.forEach(f => {
    const div = document.createElement('div');
    div.className = 'frame-item';
    div.innerHTML = `<span class="fname" title="${esc(f.name)}">${esc(f.name)}</span>`;

    const rootBtn = document.createElement('button');
    rootBtn.className = 'add-root-btn';
    rootBtn.textContent = 'Root追加';
    rootBtn.addEventListener('click', () => addNode(f.id, null));
    div.appendChild(rootBtn);

    const childBtn = document.createElement('button');
    childBtn.className = 'add-child-btn' + (selectedParentId ? ' visible' : '');
    childBtn.textContent = '子として追加';
    childBtn.addEventListener('click', () => addNode(f.id, selectedParentId));
    div.appendChild(childBtn);

    el.appendChild(div);
  });
}

function addNode(id, parentId) {
  // detach from current position
  roots = roots.filter(r => r !== id);
  for (const pid in tree) tree[pid] = tree[pid].filter(c => c !== id);
  if (!tree[id]) tree[id] = [];

  if (parentId === null) {
    roots.push(id);
  } else {
    if (!tree[parentId]) tree[parentId] = [];
    tree[parentId].push(id);
  }
  saveAndRender();
}

// ---- Tree ----
function renderTree() {
  const root = document.getElementById('tree-root');
  root.innerHTML = '';
  if (!roots.length) {
    root.innerHTML = '<div class="tree-empty">↑ 「Root追加」でルートを追加してください</div>';
    return;
  }
  roots.forEach(id => root.appendChild(mkNode(id, 0)));
}

function mkNode(id, depth) {
  const f = frames.find(fr => fr.id === id);
  const name = f ? f.name : id;
  const children = tree[id] || [];
  const isCol = collapsed[id] || false;
  const isSelected = selectedParentId === id;

  const wrap = document.createElement('div');

  const nodeEl = document.createElement('div');
  nodeEl.className = 'tree-node' + (isSelected ? ' selected' : '');
  nodeEl.dataset.id = id;
  nodeEl.title = '親として選択';
  nodeEl.addEventListener('click', () => {
    if (selectedParentId === id) clearParent();
    else setParent(id);
  });

  // Toggle
  if (children.length > 0) {
    const tog = document.createElement('div');
    tog.className = 'tog';
    tog.textContent = isCol ? '▶' : '▼';
    tog.title = isCol ? '展開' : '折りたたむ';
    tog.addEventListener('click', e => { e.stopPropagation(); post({ type: 'toggle-collapse', nodeId: id }); });
    nodeEl.appendChild(tog);
  } else {
    const sp = document.createElement('div'); sp.className = 'sp'; nodeEl.appendChild(sp);
  }

  const nameEl = document.createElement('span');
  nameEl.className = 'nname'; nameEl.textContent = name; nameEl.title = name;
  nodeEl.appendChild(nameEl);

  // Actions
  const acts = document.createElement('div'); acts.className = 'acts';

  const jumpBtn = document.createElement('button');
  jumpBtn.className = 'ibtn'; jumpBtn.textContent = '↗'; jumpBtn.title = 'デザインへ移動';
  jumpBtn.addEventListener('click', e => { e.stopPropagation(); post({ type: 'jump-to-design', nodeId: id }); });

  const upBtn = document.createElement('button');
  upBtn.className = 'ibtn'; upBtn.textContent = '↑'; upBtn.title = '上に移動';
  upBtn.addEventListener('click', e => { e.stopPropagation(); moveNode(id, -1); });

  const downBtn = document.createElement('button');
  downBtn.className = 'ibtn'; downBtn.textContent = '↓'; downBtn.title = '下に移動';
  downBtn.addEventListener('click', e => { e.stopPropagation(); moveNode(id, 1); });

  const delBtn = document.createElement('button');
  delBtn.className = 'ibtn'; delBtn.textContent = '✕'; delBtn.title = 'ツリーから削除';
  delBtn.addEventListener('click', e => { e.stopPropagation(); removeNode(id); });

  acts.appendChild(jumpBtn);
  acts.appendChild(upBtn);
  acts.appendChild(downBtn);
  acts.appendChild(delBtn);
  nodeEl.appendChild(acts);
  wrap.appendChild(nodeEl);

  // Children
  if (!isCol && children.length > 0) {
    const childWrap = document.createElement('div');
    childWrap.className = 'children';
    children.forEach(cid => childWrap.appendChild(mkNode(cid, depth + 1)));
    wrap.appendChild(childWrap);
  }
  return wrap;
}

function moveNode(id, dir) {
  // find in roots or parent
  const rootIdx = roots.indexOf(id);
  if (rootIdx !== -1) {
    const newIdx = rootIdx + dir;
    if (newIdx < 0 || newIdx >= roots.length) return;
    roots.splice(rootIdx, 1);
    roots.splice(newIdx, 0, id);
    saveAndRender(); return;
  }
  for (const pid in tree) {
    const idx = tree[pid].indexOf(id);
    if (idx !== -1) {
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= tree[pid].length) return;
      tree[pid].splice(idx, 1);
      tree[pid].splice(newIdx, 0, id);
      saveAndRender(); return;
    }
  }
}

function removeNode(id) {
  roots = roots.filter(r => r !== id);
  for (const pid in tree) tree[pid] = tree[pid].filter(c => c !== id);
  if (selectedParentId === id) clearParent();
  saveAndRender();
}

function saveAndRender() {
  post({ type: 'save-tree', tree });
  renderTree();
}

// ---- View panel ----
function renderViewList() {
  const el = document.getElementById('view-list');
  if (!roots.length) { el.innerHTML = '<div class="empty">ツリーを構築して遷移図を生成してください</div>'; return; }
  el.innerHTML = '';
  function renderViewNode(id, depth) {
    const f = frames.find(fr => fr.id === id);
    const name = f ? f.name : id;
    const children = tree[id] || [];
    const card = document.createElement('div');
    card.className = 'view-card';
    card.style.marginLeft = (depth * 14) + 'px';
    const nameEl = document.createElement('span');
    nameEl.className = 'vname'; nameEl.textContent = name; nameEl.title = name;
    card.appendChild(nameEl);
    if (children.length) {
      const chip = document.createElement('span');
      chip.className = 'chip'; chip.textContent = children.length + '子';
      card.appendChild(chip);
    }
    if (f) {
      const link = document.createElement('a');
      link.className = 'url-link'; link.textContent = 'URL ↗';
      link.href = f.url; link.target = '_blank';
      link.addEventListener('click', e => e.stopPropagation());
      card.appendChild(link);
    }
    card.addEventListener('click', () => post({ type: 'jump-to-design', nodeId: id }));
    card.addEventListener('mouseenter', (e) => showFloat(id, name, e.clientX, e.clientY));
    card.addEventListener('mousemove',  (e) => positionFloat(e.clientX, e.clientY));
    card.addEventListener('mouseleave', hideFloat);
    el.appendChild(card);
    if (!collapsed[id]) children.forEach(c => renderViewNode(c, depth + 1));
  }
  roots.forEach(r => renderViewNode(r, 0));
}

// ---- Buttons ----
document.getElementById('btn-scan').addEventListener('click', () => post({ type: 'scan' }));
document.getElementById('btn-generate').addEventListener('click', () => {
  if (!roots.length) { alert('ルートノードを追加してください'); return; }
  post({ type: 'generate', tree, roots });
});
document.getElementById('btn-regen').addEventListener('click', () => {
  if (!roots.length) { alert('ルートノードを追加してください'); return; }
  post({ type: 'regenerate', roots });
});

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

post({ type: 'scan' });
</script>
</body>
</html>
